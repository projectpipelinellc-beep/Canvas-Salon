<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ─────────────────────────────────────────────── -->
    <title>Canvas Salon Studio | Hair &amp; Beauty Salon in Mahopac, NY</title>
    <meta
      name="description"
      content="Discover Canvas Salon Studio in Mahopac, New York, offering hair, makeup, waxing and brow services. View availability and book your appointment online."
    />
    <link rel="canonical" href="https://www.canvassalonstudiony.com/" />

    <!--
      This is a private, unpublished REDESIGN CONCEPT and must never be
      indexed by search engines. Do not remove this tag while this project
      remains a concept rather than the salon's live website.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── Open Graph ──────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Canvas Salon Studio" />
    <meta property="og:title" content="Canvas Salon Studio | Hair & Beauty Salon in Mahopac, NY" />
    <meta
      property="og:description"
      content="Discover Canvas Salon Studio in Mahopac, New York, offering hair, makeup, waxing and brow services. View availability and book your appointment online."
    />
    <meta property="og:image" content="/assets/hero/hero-main.svg" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ── Icons ───────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Fonts: Playfair Display (editorial serif, headings) + Inter (sans, body) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      ── Structured data (LocalBusiness / HairSalon) ─────────────────
      DEVELOPER NOTE: Only supplied, confirmed information is included
      here. Do not add prices, email, social links, staff, or specific
      services until the owner has approved them.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "Canvas Salon Studio",
        "image": "/assets/hero/hero-main.svg",
        "telephone": "+1-845-628-0188",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "271 U.S. Route 6",
          "addressLocality": "Mahopac",
          "addressRegion": "NY",
          "postalCode": "10541",
          "addressCountry": "US"
        },
        "url": "https://www.canvassalonstudiony.com/",
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Tuesday", "opens": "10:00", "closes": "18:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Wednesday", "opens": "10:00", "closes": "17:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Thursday", "opens": "10:00", "closes": "18:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Friday", "opens": "10:00", "closes": "19:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "18:00" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
